name: Database migrations

# Applies any new file in supabase/migrations/ to the hosted Supabase project
# as soon as it lands on main. Migrations are expected to be idempotent
# (IF NOT EXISTS / DROP ... IF EXISTS) so a replay is always safe.
#
# Run it by hand from the Actions tab to check the remote without changing it:
# mode "check" links the project and lists local vs applied migrations, then
# stops. Editing this file does not itself trigger a run — only migrations do.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = list migrations only · apply = also run db push"
        type: choice
        options: [check, apply]
        default: check

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # The project ref works as either a repository variable or a secret, so
      # it does not matter which tab it was added under. A job-level `if:`
      # cannot read secrets, which is why the check is a step instead.
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Say plainly what is missing rather than skipping in silence.
      - name: Check configuration
        id: config
        run: |
          missing=""
          [ -n "$SUPABASE_PROJECT_ID" ] || missing="$missing SUPABASE_PROJECT_ID"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Migrations not configured::Missing:$missing — add them under Settings → Secrets and variables → Actions. Nothing was applied."
            echo "Not configured. Missing:$missing"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Configured for project $SUPABASE_PROJECT_ID"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.config.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Local files beside what the remote has recorded as applied. A migration
      # with no remote version is one `db push` would run.
      - name: Show migration status
        if: steps.config.outputs.ready == 'true'
        run: supabase migration list

      # A merge always applies; a manual run only when asked to.
      - name: Apply migrations
        if: steps.config.outputs.ready == 'true' && (github.event_name == 'push' || inputs.mode == 'apply')
        run: supabase db push

      - name: Check-only notice
        if: steps.config.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode != 'apply'
        run: echo "Check mode — nothing was applied. Re-run with mode=apply to push."
