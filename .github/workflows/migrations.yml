name: Database migrations

# Applies any new file in supabase/migrations/ to the hosted Supabase project
# as soon as it lands on main. Migrations are expected to be idempotent
# (IF NOT EXISTS / DROP ... IF EXISTS) so a replay is always safe.
#
# Run it by hand from the Actions tab to check the remote without changing it:
# mode "check" links the project and lists local vs applied migrations, then
# stops. Editing this file does not itself trigger a run — only migrations do.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = list migrations only · apply = also run db push"
        type: choice
        options: [check, apply]
        default: check

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # The project ref works as either a repository variable or a secret, so
      # it does not matter which tab it was added under. A job-level `if:`
      # cannot read secrets, which is why the check is a step instead.
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Say plainly what is missing or malformed rather than failing three
      # steps later with a CLI error. Nothing here echoes a secret value —
      # only its shape, which is what actually goes wrong in practice.
      - name: Check configuration
        id: config
        run: |
          missing=""
          [ -n "$SUPABASE_PROJECT_ID" ] || missing="$missing SUPABASE_PROJECT_ID"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Migrations not configured::Missing:$missing — add them under Settings → Secrets and variables → Actions. Nothing was applied."
            echo "Not configured. Missing:$missing"
            exit 0
          fi

          # A pasted secret often carries a trailing newline or space. Neither
          # the token nor the project ref can legitimately contain whitespace,
          # so strip it; the password is left exactly as given.
          token=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')
          ref=$(printf '%s' "$SUPABASE_PROJECT_ID" | tr -d '[:space:]')

          if [ "${#token}" -ne "${#SUPABASE_ACCESS_TOKEN}" ]; then
            echo "Note: stripped whitespace from SUPABASE_ACCESS_TOKEN (was ${#SUPABASE_ACCESS_TOKEN} chars, now ${#token})."
          fi
          if [ "${#ref}" -ne "${#SUPABASE_PROJECT_ID}" ]; then
            echo "Note: stripped whitespace from SUPABASE_PROJECT_ID."
          fi

          # Shape checks. These warn rather than fail, so a valid token in a
          # format newer than this check still gets its chance.
          if printf '%s' "$token" | grep -Eq '^sbp_(oauth_)?[a-f0-9]{40}$'; then
            echo "Access token looks like a personal access token."
          elif printf '%s' "$token" | grep -q '^eyJ'; then
            echo "::warning title=Wrong kind of token::SUPABASE_ACCESS_TOKEN is a project API key (anon or service_role). The CLI needs a personal access token from supabase.com/dashboard/account/tokens, which starts sbp_."
          else
            echo "::warning title=Access token looks wrong::SUPABASE_ACCESS_TOKEN is ${#token} characters and is not sbp_ followed by 40 hex characters (44 in total). If it was pasted in parts or truncated, re-copy it whole from supabase.com/dashboard/account/tokens."
          fi
          case "$ref" in
            *.*|*/*|http*)
              echo "::warning title=Project ref looks wrong::SUPABASE_PROJECT_ID looks like a URL or hostname. It should be just the ref, e.g. abcdefghijklmnopqrst." ;;
            *)
              if [ "${#ref}" -ne 20 ]; then
                echo "::warning title=Project ref looks wrong::SUPABASE_PROJECT_ID is ${#ref} characters; a project ref is normally 20."
              fi ;;
          esac

          if printf '%s' "$SUPABASE_DB_PASSWORD" | grep -Eq '^[[:space:]]|[[:space:]]$'; then
            echo "::warning title=Database password has whitespace::SUPABASE_DB_PASSWORD starts or ends with whitespace. It is used as given, so if it was pasted with a stray newline, re-add it without one."
          fi

          # Hand the cleaned values to the later steps.
          {
            echo "SUPABASE_ACCESS_TOKEN=$token"
            echo "SUPABASE_PROJECT_ID=$ref"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Configured."

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.config.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Local files beside what the remote has recorded as applied. A migration
      # with no remote version is one `db push` would run.
      - name: Show migration status
        if: steps.config.outputs.ready == 'true'
        run: supabase migration list

      # A merge always applies; a manual run only when asked to.
      - name: Apply migrations
        if: steps.config.outputs.ready == 'true' && (github.event_name == 'push' || inputs.mode == 'apply')
        run: supabase db push

      - name: Check-only notice
        if: steps.config.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode != 'apply'
        run: echo "Check mode — nothing was applied. Re-run with mode=apply to push."
